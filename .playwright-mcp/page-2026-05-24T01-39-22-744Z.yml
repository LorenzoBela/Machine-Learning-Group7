          - button "How does S-Pay track my credit limits?" [ref=e227] [cursor=pointer]:
            - generic [ref=e228]: How does S-Pay track my credit limits?
            - img [ref=e229]
          - paragraph [ref=e231]: S-Pay works on a manual-tracking paradigm. You register your purchase amount and the number of installment months. The system automatically computes monthly amortization distributions and subtracts unpaid amounts from your credit cap to keep you fully aware of credit utilization.
        - generic [ref=e232]:
          - button "Do I need to share my Shopee account password?" [ref=e233] [cursor=pointer]:
            - generic [ref=e234]: Do I need to share my Shopee account password?
            - img [ref=e235]
          - paragraph [ref=e237]: Absolutely not. S-Pay is entirely independent. We prioritize security and privacy by avoiding any direct scraping integrations. You simply enter installment terms manually or query your AI companion to update records.
        - generic [ref=e238]:
          - button "What is the NootAI assistant?" [ref=e239] [cursor=pointer]:
            - generic [ref=e240]: What is the NootAI assistant?
            - img [ref=e241]
          - paragraph [ref=e243]: NootAI is your built-in financial assistant. Accessible directly from your client portal, you can ask it questions about upcoming bills, category budgets, or request suggestions to keep your amortization schedules optimized.
        - generic [ref=e244]:
          - button "Is there a role option for administrator access?" [ref=e245] [cursor=pointer]:
            - generic [ref=e246]: Is there a role option for administrator access?
            - img [ref=e247]
